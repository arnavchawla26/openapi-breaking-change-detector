[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oadiff"
version = "0.1.0"
description = "Diff two OpenAPI/Swagger specs and classify changes as breaking or non-breaking for API consumers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oadiff = "oadiff.cli:main"

[tool.setuptools.packages.find]
include = ["oadiff*"]
